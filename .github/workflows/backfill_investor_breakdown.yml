name: backfill-investor-breakdown

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일 (YYYY-MM-DD)"
        required: false
        default: "2022-01-03"
      end_date:
        description: "종료일 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        default: ""
      max_runtime_min:
        description: "청크(월)당 최대 시간(분) — KRX 세션 1시간 만료 감안, 기본 50분"
        required: false
        default: "50"
      mismatch_ratio_stop:
        description: "기존 inst_foreign_net_buy 대조 시 이 비율 넘게 불일치하면 즉시 중단(기본 0.005=0.5%)"
        required: false
        default: "0.005"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      # 월 단위 청크로 pull+백필 반복 — 2026-07 사고: 기본 범위 전체(2022-01~오늘,
      # 1150+영업일)를 한 번에 git lfs pull하려다 대부분 실패해 실제로는 9일만
      # 처리됐음. 청크마다 pull → 실행 → 커밋·푸시까지 끝내야 중간에 멈춰도
      # 그때까지 진행분이 안전하게 남는다.
      - name: Run investor breakdown backfill (month-chunked)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          set -eo pipefail
          END="${{ inputs.end_date }}"
          if [ -z "$END" ]; then END=$(date +%Y-%m-%d); fi
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git lfs install --local
          # 이 파일이 아직 한 번도 안 생겼으면(이번 청크가 처리할 날짜가 0개인 경우
          # 포함) 아래 git add가 "did not match any files"로 exit 128 나며 전체가
          # 죽는다(2026-07 실제 발생 확인) — 미리 만들어서 항상 add 대상이 있게 한다.
          touch investor_flow_residual_summary.jsonl

          python list_month_chunks.py "${{ inputs.start_date }}" "$END" > /tmp/chunks.txt
          while IFS=, read -r CSTART CEND; do
            echo "=== 청크 $CSTART ~ $CEND ==="
            INCLUDES=$(python list_backfill_dates.py "$CSTART" "$CEND" "daily_investor_flow")
            FIRST_FILE=$(echo "$INCLUDES" | cut -d',' -f1)
            echo "--- pull 전: $FIRST_FILE 크기 $(wc -c < "$FIRST_FILE" 2>&1 || echo N/A)바이트 ---"
            git lfs pull --include="$INCLUDES" || true
            git lfs pull --include="$INCLUDES"
            # 진단(2026-07: 모든 청크가 "대상 0일" — LFS 할당량은 여유 있음(6.3/10GB)
            # 확인됐으니, 실제로 pull이 뭘 받아왔는지 파일 크기로 직접 확인한다.
            # 포인터 스텁은 ~130바이트, 진짜 sqlite 파일은 최소 수십KB.
            echo "--- pull 후: $FIRST_FILE 크기 $(wc -c < "$FIRST_FILE" 2>&1 || echo N/A)바이트, 헤더: $(head -c 16 "$FIRST_FILE" 2>&1) ---"

            set +e
            python backfill_investor_breakdown.py --start "$CSTART" --end "$CEND" \
              --max-runtime-min "${{ inputs.max_runtime_min }}" \
              --mismatch-ratio-stop "${{ inputs.mismatch_ratio_stop }}"
            STATUS=$?
            set -e

            git add data/ investor_flow_residual_summary.jsonl
            git commit -m "chore: investor breakdown backfill progress ($CSTART~$CEND)" || echo "no changes"
            git pull --rebase origin main
            git push

            if [ $STATUS -ne 0 ]; then
              echo "청크 $CSTART~$CEND에서 중단(대조 불일치 등, 종료코드 $STATUS) — 이후 청크는 건너뜁니다. 사람 확인 필요."
              exit 1
            fi
          done < /tmp/chunks.txt
